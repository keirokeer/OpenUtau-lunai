name: Release Build New

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        default: "0.0.0.0"
        type: string
      release:
        description: "Release"
        type: boolean
        default: true
      beta:
        description: "Beta"
        type: boolean
        default: false
      draft:
        description: "Draft"
        type: boolean
        default: false

env:
  RELEASE_NAME: ${{ inputs.version }}${{ inputs.beta && ' Beta' || '' }}
  REPO_URL: "https://github.com/keirokeer/OpenUtau-lunai"

jobs:
  build:
    runs-on: ${{ matrix.arch.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: win-x64, rid: win-x64, arch: x64, os: win, runs-on: windows-latest }
          - { name: win-x86, rid: win-x86, arch: x86, os: win, runs-on: windows-latest }
          - { name: win-arm64, rid: win-arm64, arch: arm64, os: win, runs-on: windows-latest }
          - { name: osx-x64, rid: osx-x64, arch: x64, os: osx, runs-on: macos-15-intel }
          - { name: osx-arm64, rid: osx-arm64, arch: arm64, os: osx, runs-on: macos-15-intel }
          - { name: linux-x64, rid: linux-x64, arch: x64, os: linux, runs-on: ubuntu-latest, linuxarch: x86_64 }
          - { name: linux-arm64, rid: linux-arm64, arch: arm64, os: linux, runs-on: ubuntu-latest, linuxarch: aarch64 }

    steps:
      # Setup
      - uses: actions/checkout@v4

      - name: Update contributors list
        run: python3 scripts/update-contributors.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Setup Node.js (for DMG)
        if: matrix.arch.os == 'osx'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch Version
        uses: justalemon/VersionPatcher@v0.8
        with:
          version: ${{ inputs.version }}
          csproj-files: "OpenUtau/*.csproj"

      # Test
      - name: Run Tests
        run: dotnet test OpenUtau.Test

      # Build
      - name: Restore dependencies
        run: dotnet restore OpenUtau -r ${{ matrix.arch.rid }}

      - name: Publish
        if: matrix.arch.os != 'osx'
        run: dotnet publish OpenUtau -c Release -r ${{ matrix.arch.rid }} --self-contained true -o bin/${{ matrix.arch.name }}

      - name: Build (MacOS)
        if: matrix.arch.os == 'osx'
        run: dotnet msbuild OpenUtau -t:BundleApp -p:Configuration=Release -p:RuntimeIdentifier=${{ matrix.arch.rid }} -p:UseAppHost=true -p:SelfContained=true -p:OutputPath=../bin/${{ matrix.arch.name }}/

      # Write release channel info
      - name: Write release channel info
        run: |
          echo '{ "Beta": ${{ inputs.beta }} }' > "bin/${{ matrix.arch.name }}/prefs-default.json"

      # Windows specific
      - name: Download DirectML (Windows)
        if: matrix.arch.os == 'win'
        shell: cmd
        run: |
          curl -L https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4 -o Microsoft.AI.DirectML.nupkg
          mkdir Microsoft.AI.DirectML
          tar -xf Microsoft.AI.DirectML.nupkg -C Microsoft.AI.DirectML
          copy /y Microsoft.AI.DirectML\bin\${{ matrix.arch.arch }}-win\DirectML.dll bin\${{ matrix.arch.name }}

      # Linux specific
      - name: Set Linux executable permissions
        if: matrix.arch.os == 'linux'
        run: chmod +x bin/${{ matrix.arch.name }}/OpenUtau-Lunai

      # Create packages (BEFORE installer creation to include DirectML)
      - name: Create portable package
        if: matrix.arch.os != 'osx'
        run: |
          cd bin/${{ matrix.arch.name }}
          7z a ../../OpenUtau-Lunai-${{ matrix.arch.name }}.zip *

      - name: Create tar.gz for Linux
        if: matrix.arch.os == 'linux'
        run: |
          tar -czf OpenUtau-Lunai-${{ matrix.arch.name }}.tar.gz -C bin/${{ matrix.arch.name }} .

      # Windows Velopack installer + update packages
      - name: Create Windows Velopack packages
        if: matrix.arch.os == 'win'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rid = '${{ matrix.arch.rid }}'
          $arch = '${{ matrix.arch.arch }}'
          $channel = if ('${{ inputs.beta }}' -eq 'true') { "$rid-beta" } else { $rid }
          $vcredist = "vcredist143-$arch"
          $version = '${{ inputs.version }}'
          $outDir = "Releases/$rid"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          dotnet tool install -g vpk --version 1.2.0
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          # Pull previous releases for deltas (must not fail the job on first channel release).
          $downloadArgs = @(
            'download', 'github',
            '--repoUrl', 'https://github.com/keirokeer/OpenUtau-lunai',
            '--channel', $channel,
            '--token', $env:GITHUB_TOKEN,
            '--outputDir', $outDir
          )
          if ('${{ inputs.beta }}' -eq 'true') { $downloadArgs += '--pre' }
          # Native tools can throw under $ErrorActionPreference=Stop on some pwsh versions.
          $prevNative = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            & vpk @downloadArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Host "vpk download skipped/failed (first release for channel?). Continuing with pack."
            }
          } finally {
            $PSNativeCommandUseErrorActionPreference = $prevNative
          }

          & vpk pack `
            --packId OpenUtau.Lunai `
            --packVersion $version `
            --packDir "bin/${{ matrix.arch.name }}" `
            --mainExe OpenUtau-Lunai.exe `
            --packTitle "OpenUtau Lunai" `
            --icon "OpenUtau/Assets/open-utau.ico" `
            --channel $channel `
            --framework $vcredist `
            --outputDir $outDir
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }

          Get-ChildItem $outDir | ForEach-Object { Write-Host "Velopack asset: $($_.Name)" }
          $setup = Get-ChildItem $outDir -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $setup) { throw "Velopack Setup.exe not found in $outDir" }
          Copy-Item $setup.FullName "OpenUtau-Lunai-$rid-Setup.exe" -Force
          # Stable download name used in release notes / migration from NSIS .exe
          Copy-Item $setup.FullName "OpenUtau-Lunai-$rid.exe" -Force

      # macOS specific
      - name: Create macOS DMG
        if: matrix.arch.os == 'osx'
        run: bash scripts/create-macos-dmg.sh ${{ matrix.arch.name }}

      # Create Appimage
      - name: Install LinuxDeploy
        uses: AnimMouse/setup-appimage@v1
        with:
          name: linuxdeploy
          url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        if: ${{ matrix.arch.os == 'linux' }}

      - name: Create appimage
        run: |
          cp OpenUtau/Assets/OpenUtau.desktop bin/${{ matrix.arch.name }}
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}/.DirIcon
          cp OpenUtau/Assets/AppRun bin/${{ matrix.arch.name }}
          chmod 755 bin/${{ matrix.arch.name }}/AppRun
          ARCH=${{ matrix.arch.linuxarch }} linuxdeploy --appdir bin/${{ matrix.arch.name }} --output appimage
          # Rename generic AppImage output to Lunai brand when present.
          for f in OpenUtau*.AppImage OpenUtau-Lunai*.AppImage; do
            if [ -f "$f" ]; then
              case "$f" in
                OpenUtau-Lunai-*) ;;
                *) mv "$f" "OpenUtau-Lunai-${{ matrix.arch.linuxarch }}.AppImage" || true ;;
              esac
            fi
          done
        if: ${{ matrix.arch.os == 'linux' }}

      # Upload all artifacts (each matrix job uploads its own; softprops merges into the tag)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.arch.name }}
          path: |
            OpenUtau-Lunai-${{ matrix.arch.name }}.exe
            OpenUtau-Lunai-${{ matrix.arch.name }}-Setup.exe
            OpenUtau-Lunai-${{ matrix.arch.name }}.zip
            OpenUtau-Lunai-${{ matrix.arch.name }}.dmg
            OpenUtau-Lunai-${{ matrix.arch.name }}.tar.gz
            OpenUtau-Lunai-*.AppImage
            bin/${{ matrix.arch.name }}/*.AppImage
            Releases/${{ matrix.arch.rid }}/*

      # Create / update GitHub Release with this arch's files
      - name: Create GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ inputs.beta }}
          draft: ${{ inputs.draft }}
          files: |
            OpenUtau-Lunai-${{ matrix.arch.name }}.exe
            OpenUtau-Lunai-${{ matrix.arch.name }}-Setup.exe
            OpenUtau-Lunai-${{ matrix.arch.name }}.zip
            OpenUtau-Lunai-${{ matrix.arch.name }}.dmg
            OpenUtau-Lunai-${{ matrix.arch.name }}.tar.gz
            OpenUtau-Lunai-*.AppImage
            bin/${{ matrix.arch.name }}/*.AppImage
            Releases/${{ matrix.arch.rid }}/*
          body: |
            ### Download for your OS:

            **Windows (Velopack — recommended)**  
            [Setup 64-bit](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-win-x64-Setup.exe)  
            [Setup 32-bit](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-win-x86-Setup.exe)  
            [Setup ARM64](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-win-arm64-Setup.exe)  
            [Portable ZIP (no in-app updates) 64-bit](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-win-x64.zip)

            **Migrating from older NSIS installs:** install the new Setup once. After that, use Help → Check for Update inside the app.

            **macOS**  
            [Intel Mac (.dmg)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-osx-x64.dmg)  
            [Apple Silicon (.dmg)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-osx-arm64.dmg)

            **Linux**  
            [AppImage (64-bit)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-x86_64.AppImage)
            [64-bit (.zip)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-linux-x64.zip)  
            [64-bit (.tar.gz)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-linux-x64.tar.gz)
            [ARM64 (.zip)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-linux-arm64.zip)
            [ARM64 (.tar.gz)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/OpenUtau-Lunai-linux-arm64.tar.gz)

            ### Notes
            - Windows settings stay in Documents\OpenUtau-Lunai (not inside the app folder).
            - macOS/Linux: download new builds from Releases for now (Velopack auto-update is Windows-first).
            - macOS users: If you see "This app is damaged", run:
              ```sh
              xattr -rc "/Applications/OpenUtau-Lunai.app"
              ```
            
            ### Getting Started
            See [Getting Started](https://github.com/stakira/OpenUtau/wiki/Getting-Started) for how to use.

            ### FAQ
            If you encountered issues, see [FAQ](https://github.com/stakira/OpenUtau/wiki/FAQ)
